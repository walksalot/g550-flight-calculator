name: Codex Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  codex:
    # TRUST GATE (2026-07-29). issue_comment, pull_request_review_comment and
    # issues all run in BASE-repo context with repository secrets and a
    # write-scoped token, regardless of who authored the text — there is no
    # fork downgrade the way there is on pull_request. On a public repository
    # that means any stranger commenting '@codex' could start this job.
    #
    # openai/codex-action already refuses to run the agent for a user without
    # repository write access, so the model was never reachable. But that check
    # lives inside the action, i.e. AFTER checkout, setup-node and `npm ci`
    # have already burned a 60-minute-timeout runner on an unauthenticated
    # request. author_association is evaluated by GitHub before the job starts,
    # so the trust decision happens before any compute is spent.
    #
    # OWNER/MEMBER/COLLABORATOR are the associations that imply write access.
    # Deliberately excluded: CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE.
    if: >-
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@codex') &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@codex') &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.body, '@codex') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Codex Assistant
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.3-codex
          effort: xhigh
          prompt: |
            You are an autonomous assistant for this repository.

            Process:
            1. Read the request context from the issue/PR comment.
            2. Make the smallest safe code changes that solve the request.
            3. Run relevant checks.
            4. Commit and push only when checks pass.
            5. Summarize exactly what changed.

            Safety:
            - Do not make unrelated refactors.
            - Keep changes scoped to the request.
            - If blocked, explain the blocker and next action.
